services:
  backend:
    build:
      context: ./backend
    container_name: realtime-ai-backend
    dns:                  # <--- Add this
      - 8.8.8.8           # <--- Add this
      - 1.1.1.1           # <--- Add this
    env_file:
      - ./.env.docker
    ports:
      - "8000:8000"
    volumes:
      - uploads_data:/app/uploads
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - db
      - redis

  worker:
    build:
      context: ./backend
    container_name: realtime-ai-worker
    dns:                  # <--- Add this
      - 8.8.8.8           # <--- Add this
      - 1.1.1.1           # <--- Add this
    env_file:
      - ./.env.docker
    command: python worker.py
    volumes:
      - uploads_data:/app/uploads
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - db
      - redis

  db:
    image: pgvector/pgvector:pg16
    container_name: realtime-ai-chat-postgres
    restart: always
    environment:
      POSTGRES_USER: chatuser
      POSTGRES_PASSWORD: chatpassword
      POSTGRES_DB: realtime_chat
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: realtime-ai-chat-redis
    restart: always
    ports:
      - "6381:6379"

volumes:
  uploads_data:
  postgres_data:
